global:
  scrape_interval: 10s

scrape_configs:
  # Приложение. Формат Prometheus отдаёт /metrics/prometheus (на /metrics — тот же набор в JSON)
  - job_name: "go_app"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["app:8080"]

  # Ресурсы сервера
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
