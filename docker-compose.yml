# Всё одной командой:   docker compose up -d --build
#   app :8080 · prometheus :9090 · grafana :3000 (дашборд без логина) · node-exporter (ресурсы сервера)
services:
  app:
    build: .
    container_name: go_web_app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - notes-data:/data          # данные заметок сохраняются между пересозданиями контейнера
    mem_limit: 128m               # лимиты видны на графиках как «доступные ресурсы»
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: always
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # просмотр без логина; редактирует только admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dz.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  notes-data:
  prometheus-data:
  grafana-data:
